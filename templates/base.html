<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Inventory Management System
        {% endblock %}
    </title>

    <style>

        :root {
            --primary: #4f46e5;
            --primary-dark: #312e81;

            --background: #f4f7fb;
            --card: #ffffff;

            --text: #1f2937;
            --muted: #6b7280;

            --border: #dfe7f5;

            --success: #16a34a;
            --danger: #dc2626;
        }


        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f3f7ff,
                    #ecfdf5
                );

            color: var(--text);
        }


        .app-layout {
            display: flex;

            min-height: 100vh;
        }


        /* SIDEBAR */

        .sidebar {
            width: 240px;

            background: white;

            border-right:
                1px solid
                var(--border);

            padding: 30px 18px;

            position: fixed;

            top: 0;
            bottom: 0;
            left: 0;

            box-shadow:
                4px 0 20px
                rgba(79, 70, 229, 0.05);
        }


        .sidebar h2 {
            color: var(--primary-dark);

            font-size: 1.1rem;

            margin-bottom: 30px;
        }


        .nav-menu {
            display: flex;

            flex-direction: column;

            gap: 10px;
        }


        .nav-menu a {
            padding: 12px 14px;

            border-radius: 9px;

            text-decoration: none;

            color: var(--text);

            font-weight: 600;

            transition: 0.2s;
        }


        .nav-menu a:hover {
            background: #eef2ff;

            color: var(--primary);
        }


        /* MAIN PAGE */

        .main-content {
            margin-left: 240px;

            width:
                calc(
                    100% - 240px
                );

            padding: 40px;
        }


        .page-header {
            margin-bottom: 30px;
        }


        .page-header h1 {
            margin: 0;

            color: var(--primary-dark);
        }


        .page-header p {
            color: var(--muted);

            margin-top: 8px;
        }


        /* CARDS */

        .card {
            background: white;

            padding: 25px;

            border-radius: 14px;

            border:
                1px solid
                var(--border);

            margin-bottom: 25px;

            box-shadow:
                0 8px 25px
                rgba(79, 70, 229, 0.07);
        }


        .card h2 {
            color: var(--primary-dark);

            margin-top: 0;
        }


        /* FORM */

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(180px, 1fr)
                );

            gap: 15px;
        }


        input {
            width: 100%;

            padding: 12px 14px;

            border:
                1px solid
                var(--border);

            border-radius: 9px;

            font-size: 0.95rem;
        }


        input:focus {
            outline: none;

            border-color: var(--primary);

            box-shadow:
                0 0 0 3px
                rgba(79, 70, 229, 0.10);
        }


        button {
            border: none;

            padding: 11px 18px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: 600;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary-dark)
                );
        }


        button:hover {
            opacity: 0.9;
        }


        .button-success {
            background:
                linear-gradient(
                    135deg,
                    #22c55e,
                    #16a34a
                );
        }


        .button-danger {
            background:
                linear-gradient(
                    135deg,
                    #ef4444,
                    #dc2626
                );
        }


        .button-secondary {
            background:
                linear-gradient(
                    135deg,
                    #6b7280,
                    #4b5563
                );
        }


        /* SEARCH */

        .search-container {
    max-width: 750px;
    margin: 0;
        }
        


        .search-box {
            display: flex;

            align-items: center;

            background: white;

            border:
                2px solid
                #e0e7ff;

            border-radius: 50px;

            padding: 6px;

            box-shadow:
                0 8px 25px
                rgba(79, 70, 229, 0.09);
        }


        .search-box input {
            flex: 1;

            border: none;

            box-shadow: none;

            padding:
                14px 18px;

            background: transparent;
        }


        .search-box button {
            border-radius: 50px;

            padding:
                13px 25px;
        }


        /* TABLE */

        .table-wrapper {
            overflow-x: auto;
        }


        table {
            width: 100%;

            border-collapse: collapse;
        }


        th,
        td {
            padding: 14px;

            border-bottom:
                1px solid
                var(--border);

            text-align: left;
        }


        th {
            background: #eef2ff;

            color: var(--primary-dark);
        }


        tbody tr:hover {
            background: #f8faff;
        }


        /* INLINE EDIT */

        .edit-input {
            display: none;

            min-width: 100px;
        }


        tr.editing .display-value {
            display: none;
        }


        tr.editing .edit-input {
            display: block;
        }


        .save-button,
        .cancel-button {
            display: none;
        }


        tr.editing .edit-button {
            display: none;
        }


        tr.editing .save-button,
        tr.editing .cancel-button {
            display: inline-block;
        }


        .actions {
            display: flex;

            gap: 7px;

            align-items: center;
        }


        .api-result {
            margin-top: 25px;

            padding: 20px;

            border-radius: 12px;

            background: #f0fdf4;

            border:
                1px solid
                #bbf7d0;
        }


        .error {
            margin-top: 15px;

            padding: 12px;

            border-radius: 8px;

            background: #fef2f2;

            color: #991b1b;
        }
.home-action-button {
    display: inline-block;

    padding: 13px 24px;

    border-radius: 9px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary-dark)
        );

    color: white;

    text-decoration: none;

    font-weight: 600;

    box-shadow:
        0 6px 18px
        rgba(79, 70, 229, 0.20);

    transition: 0.2s;
}


.home-action-button:hover {
    transform: translateY(-1px);

    box-shadow:
        0 8px 22px
        rgba(79, 70, 229, 0.25);
}

        @media
        /* HOME PAGE */

.home-page {
    text-align: center;
}


.home-page .page-header {
    text-align: center;
}


.home-card {
    text-align: center;

    max-width: 1000px;

    margin-left: auto;
    margin-right: auto;

    padding: 45px;
}


.home-card h2 {
    text-align: center;
}


.home-card p {
    text-align: center;

    line-height: 1.7;
}


.home-button-container {
    display: flex;

    justify-content: center;

    margin-top: 30px;
}


.home-action-button {
    display: inline-block;

    padding: 13px 24px;

    border-radius: 9px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary-dark)
        );

    color: white;

    text-decoration: none;

    font-weight: 600;

    box-shadow:
        0 6px 18px
        rgba(79, 70, 229, 0.20);

    transition: 0.2s;
}


.home-action-button:hover {
    transform: translateY(-1px);

    box-shadow:
        0 8px 22px
        rgba(79, 70, 229, 0.25);
}
        
        
        (max-width: 800px) {

            .sidebar {
                width: 190px;
            }


            .main-content {
                margin-left: 190px;

                width:
                    calc(
                        100% - 190px
                    );

                padding: 20px;
            }

        }

    </style>

</head>


<body>

    <div class="app-layout">

        <aside class="sidebar">

    <h2>Inventory System</h2>

    <nav class="nav-menu">

        <a href="/">
            Home
        </a>

        <a href="/admin">
            Inventory Management
        </a>

        <a href="/inventory">
            Inventory Script
        </a>

    </nav>

</aside>


        <main class="main-content">

            {% block content %}
            {% endblock %}

        </main>

    </div>


    {% block scripts %}
    {% endblock %}

</body>

</html>
